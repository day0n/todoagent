# TodoAgent owns this configuration. User Ghostty files are intentionally not
# loaded so every Task terminal keeps the same security and resource bounds.
scrollback-limit = 4000000
image-storage-limit = 16000000
clipboard-read = ask
clipboard-paste-protection = true
clipboard-paste-bracketed-safe = true
title-report = false
desktop-notifications = true
# TUI apps such as Claude Code decide whether to emit their palette from the
# process environment. A macOS app launched from an IDE often inherits
# NO_COLOR / NODE_DISABLE_COLORS, which chalk treats as "no color" even when
# the PTY is a real Ghostty surface. An empty assignment removes that key.
# COLORTERM/FORCE_COLOR keep truecolor sequences (Claude orange/yellow).
env = NO_COLOR=
env = NODE_DISABLE_COLORS=
env = COLORTERM=truecolor
env = FORCE_COLOR=3
env = TERM_PROGRAM=ghostty
